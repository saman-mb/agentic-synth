name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so `nx affected --base` can see the PR base SHA.
          fetch-depth: 0

      # Pin clang-format-18 to match .pre-commit-config.yaml so local devs
      # and CI produce identical output. Plain `apt install clang-format`
      # pulls noble's default (22) which disagrees with us on brace-init.
      - name: Install clang-format-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18

      - name: Check clang-format
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h' '*.hpp' '*.cxx' '*.cc')
          if [ "${#files[@]}" -gt 0 ]; then
            clang-format-18 --dry-run --Werror "${files[@]}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      # Local Nx cache only (no Nx Cloud). Restores task hashes across runs
      # on the same lockfile; first miss is a cold compile like today.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # PRs: only projects affected vs the PR base (docs-only → empty set,
      # Nx exits 0). Push to master/main: full run-many including build.
      #
      # Run this BEFORE the reversed-import probe. The probe writes
      # libs/data/src/lib/__boundary_probe__.ts (a data→web import). If that
      # file is still on disk during `nx run-many -t lint`, eslint reports
      # circular web→data→web on every web file (#329 master push).
      - name: Nx graph tasks
        env:
          NX_DAEMON: "false"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
            echo "NX affected base=${BASE} head=${HEAD}"
            echo "Affected projects:"
            npx nx show projects --affected --base="${BASE}" --head="${HEAD}"
            npx nx affected -t test lint --base="${BASE}" --head="${HEAD}"
          else
            echo "NX run-many (push to ${GITHUB_REF_NAME})"
            npx nx run-many -t build test lint
          fi

      - name: Assert module-boundary lint
        run: |
          node scripts/assert-reversed-import.mjs
          rm -f libs/data/src/lib/__boundary_probe__.ts

  # Build + run the test target only. We intentionally do NOT build the
  # plugin / standalone GUI targets here — they require JUCE's WebView,
  # which on Linux pulls libgtk-3 + libwebkit2gtk-4.1 + pkg-config and a
  # version-sensitive linker tree that has cost us 7 consecutive CI runs
  # of whack-a-mole. The dev machine is macOS where JUCE WebView works
  # natively via WKWebView; the user builds + runs the plugin locally on
  # every change. Cross-platform plugin CI is deferred until distribution
  # becomes a concern.
  #
  # The test target gates its 3 WebView-using files on
  # AGENTIC_SYNTH_BUILD_PLUGIN via generator expressions, so flipping
  # the flag drops WebUiComponent.cpp + agentic_synth_ui_assets +
  # juce::juce_gui_extra cleanly — no gtk, no webkit, no pkg-config.
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # Minimal JUCE headless build deps. No gtk/webkit/pkg-config —
          # those are only needed for the plugin's WebView path.
          sudo apt-get install -y -qq \
            libfreetype-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfontconfig-dev

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28.x"

      # ccache cuts the JUCE rebuild cost across runs. Key on os + the
      # build-type so debug / release caches don't collide.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-tests-debug
          max-size: 500M

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAGENTIC_SYNTH_BUILD_TESTS=ON \
            -DAGENTIC_SYNTH_BUILD_PLUGIN=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # --parallel 2 caps concurrency under JUCE's heavy TUs to stay
      # inside the 16 GB ubuntu-latest free-tier RAM envelope.
      # Build the Catch2 suite and the JUCE-free C API tests (#305).
      - name: Build test target
        run: cmake --build build --target agentic_synth_tests agsynth_capi_tests --config Debug --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --build-config Debug --output-on-failure

  # Emscripten/wasm is independent of JUCE and the Catch2 suite, so it
  # does not wait on lint. PLUGIN/TESTS stay off: the wasm graph is
  # C API + glue only (#306).
  build-wasm:
    name: Build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read Emscripten version
        id: emsdk
        run: echo "version=$(cat cmake/emscripten-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build wasm
        run: npx nx run wasm:build-wasm

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agsynth-wasm
          path: |
            dist/wasm/agsynth.js
            dist/wasm/agsynth.wasm
