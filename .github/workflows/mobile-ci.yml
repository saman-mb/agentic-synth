name: Mobile CI

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - 'libs/engine-bridge/**'
      - 'libs/shared-types/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'libs/engine-bridge/**'
      - 'libs/shared-types/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-test:
    name: Mobile lint + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile
        env:
          NX_DAEMON: 'false'
        run: npx nx run mobile:lint

      - name: Mobile unit + smoke tests
        env:
          NX_DAEMON: 'false'
          AGSYNTH_FORCE_MOCK: '1'
        run: npx nx run mobile:test

  eas-dev-client:
    name: EAS dev client (optional)
    runs-on: ubuntu-latest
    needs: mobile-test
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: EAS build placeholder
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -z "$EAS_TOKEN" ]; then
            echo "::warning::EAS_TOKEN not configured — skipping iOS/Android dev client builds."
            echo "Configure EAS_TOKEN + EXPO_TOKEN in repo secrets to enable hardware smoke builds."
            exit 0
          fi
          npx eas-cli build --profile development --platform all --non-interactive --cwd apps/mobile
