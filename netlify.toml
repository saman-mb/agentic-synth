# Netlify deploy configuration for the web demo (#280).
#
# CI (.github/workflows/deploy.yml) prebuilds ui/dist and runs
# scripts/sync-prompts.mjs before deploying; `command` exists so manual
# `netlify deploy` / `netlify dev` from a fresh checkout also work.

[build]
  publish = "ui/dist"
  command = "node scripts/sync-prompts.mjs && cd ui && npm ci && npm run build"
  functions = "netlify/functions"

# generate.mts imports the shared patch codec from ui/src (outside the
# functions directory). Netlify's server-side bundler only reaches
# outside the functions dir for paths declared here — without them the
# function 404s at request time (#280 live finding).
[functions]
  included_files = [
    "ui/src/demo/patchCodec.ts",
    "ui/src/data/modulation.ts",
    "netlify/functions/lib/prompts.generated.mts",
  ]

[build.environment]
  NODE_VERSION = "22"

# NOTE: no redirect for /api/generate — the function registers its own
# route via in-source `config = { path: "/api/generate" }`. A force
# redirect to /.netlify/functions/generate here would shadow the route
# and 404 (the default URL doesn't exist for v2 functions with a custom
# path) — #280 live finding.

# SPA catch-all: force = false, so the function route and real files
# always win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# One-process local dev: `netlify dev` from the repo root starts Vite on
# :5173 and proxies it (plus /api/generate) on :8888. Requires
# GEMINI_KEY in the environment for generation to work.
[dev]
  framework = "#custom"
  command = "node scripts/sync-prompts.mjs && cd ui && npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false
