# Netlify deploy configuration for the web demo (#280).
#
# CI (.github/workflows/deploy.yml) prebuilds apps/web/dist and runs
# scripts/sync-prompts.mjs before deploying; `command` exists so manual
# `netlify deploy` / `netlify dev` from a fresh checkout also work.

[build]
  publish = "apps/web/dist"
  command = "node scripts/sync-prompts.mjs && npm ci && npx nx build web"
  functions = "netlify/functions"

# generate.mts imports the shared patch codec from libs/codec (outside the
# functions directory). Netlify's server-side bundler only reaches
# outside the functions dir for paths declared here — without them the
# function 404s at request time (#280 live finding).
[functions]
  included_files = [
    "libs/codec/src/index.ts",
    "libs/codec/src/lib/patchCodec.ts",
    "libs/prompt/src/index.ts",
    "libs/prompt/src/lib/sanitizePrompt.ts",
    "libs/data/src/lib/paramRanges.ts",
    "netlify/functions/lib/prompts.generated.mts",
  ]

[build.environment]
  NODE_VERSION = "22"

# NOTE: no redirect for /api/generate — the function registers its own
# route via in-source `config = { path: "/api/generate" }`. A force
# redirect to /.netlify/functions/generate here would shadow the route
# and 404 (the default URL doesn't exist for v2 functions with a custom
# path) — #280 live finding.

# Canonical domain prep (#328).
#
# Today the public origin is https://timbre-synth.netlify.app (200, no
# 301). Custom domains are added in the Netlify UI after DNS — they are
# not created by this file.
#
# After tambra.app (or tambra.audio) is registered, pointed at Netlify,
# and attached to this site:
#   1. Uncomment the host redirect below (it must stay above the SPA rule).
#   2. Point og:image / twitter:image in apps/web/index.html at the canonical
#      origin and re-check card validators.
#
# [[redirects]]
#   from = "https://timbre-synth.netlify.app/*"
#   to = "https://tambra.app/:splat"
#   status = 301
#   force = true

# SPA catch-all: force = false, so the function route and real files
# always win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# One-process local dev: `netlify dev` from the repo root starts Vite on
# :5173 and proxies it (plus /api/generate) on :8888. Requires
# GEMINI_KEY in the environment for generation to work.
[dev]
  framework = "#custom"
  command = "node scripts/sync-prompts.mjs && npx nx serve web"
  targetPort = 5173
  port = 8888
  autoLaunch = false
